const un64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(){
  const err = document.getElementById('err');
  err.textContent = '';
  try{
    const pw = document.getElementById('pw').value;
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:un64(SALT), iterations:310000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);

    document.open(); document.write(data.html); document.close();

document.getElementById('go').addEventListener('click', unlock);
