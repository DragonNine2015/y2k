async function unlock(){
  const err = document.getElementById('err');
  err.textContent = '';
  try{
    const pw = document.getElementById('pw').value;
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:un64(SALT), iterations:310000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:un64(IV)}, key, un64(CT));
    const data = JSON.parse(new TextDecoder().decode(pt));
    if (new Date(data.expiry + 'T23:59:59') < new Date()){
      document.body.innerHTML = '<div class="box"><h1>만료된 문서입니다</h1><p>새 링크/비밀번호는 공대 디스코드 공지를 확인하세요.</p></div>';
      return;
    }
    document.open(); document.write(data.html); document.close();
  }catch(e){ err.textContent = '비밀번호가 올바르지 않습니다'; }
}
