<title>y2k — 개인 진단</title><style>/* 룩만 html-doc 보고서(R) 디자인 시스템으로 — 2026-10-07.
   용구님 "스타일을 입히랬지 내용을 바꾸라 그랬냐". **구성·마크업은 그대로 두고 색·폰트만 바꿨다.**
   토큰은 skills/html-doc/templates/report/report-template.html 의 :root 를 그대로 가져온다. */
:root{
  color-scheme:light;
  --bg:#f4f6f8; --surface:#ffffff; --sunk:#eef1f4;
  --ink:#141a22; --ink2:#46505e; --muted:#7a8494; --line:#dfe3e9; --line2:#c9cfd8;
  --accent:#2d5bd0; --accent-soft:#e5ecfb;
  --crit:#d03b3b; --crit-soft:#fbe9e9; --serious:#ec835a; --warn:#fab219; --warn-soft:#fdf3dc; --warn-ink:#a86b00;
  --good:#0ca30c; --good-soft:#e4f5e4; --good-ink:#006300;
  --bar:#2a78d6; --bar-dim:#b7d3f6;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1115; --surface:#161a20; --sunk:#1c2129;
    --ink:#eef1f5; --ink2:#b9c1cc; --muted:#8a93a1; --line:#29303a; --line2:#3a424d;
    --accent:#7b9ff2; --accent-soft:#1d2740;
    --crit-soft:#3a1d1f; --warn-soft:#3a2f14; --warn-ink:#fab219; --good-soft:#15301a; --good-ink:#3cc23c;
    --bar:#3987e5; --bar-dim:#1c3a63;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1115; --surface:#161a20; --sunk:#1c2129;
  --ink:#eef1f5; --ink2:#b9c1cc; --muted:#8a93a1; --line:#29303a; --line2:#3a424d;
  --accent:#7b9ff2; --accent-soft:#1d2740;
  --crit-soft:#3a1d1f; --warn-soft:#3a2f14; --warn-ink:#fab219; --good-soft:#15301a; --good-ink:#3cc23c;
  --bar:#3987e5; --bar-dim:#1c3a63;
}

.concl{margin:10px 0 4px;padding:12px 16px;border-left:3px solid var(--good);background:var(--good-soft);border-radius:8px;color:var(--ink)}
.concl p{margin:0}
.mebtn,.mrow button{padding:9px 16px;border:0;border-radius:10px;background:var(--good);color:#fff;font:inherit;cursor:pointer}.mebtn{margin:12px 0 4px}.mrow .ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;align-items:center;justify-content:center;padding:16px}.modal.on{display:flex}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}.chip{padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;font-size:14px}.chip:hover{border-color:var(--good);color:var(--good)}
.mbox{width:100%;max-width:380px;background:var(--surface);border-radius:14px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.25)}.mtitle{font-weight:700;margin:0 0 10px}.msub{margin:10px 0 4px;font-size:14px;color:var(--ink)}.msub a{color:var(--good)}
.mbox input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.pdoc{margin:8px 0 18px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.next{padding:12px 16px;border:1px solid var(--line);background:var(--surface);border-radius:10px}
.next ul{margin:4px 0;padding-left:18px}.next li{margin:6px 0;font-size:15px}
.basis{font-size:14px;color:var(--ink2)}.basis h2{font-size:14.5px;margin:16px 0 4px;color:var(--ink)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:900px;margin:0 auto;padding:26px 18px 90px}
.brand{font-size:30px;margin:0 0 2px;letter-spacing:-.4px;font-weight:700}
.brandsub{color:var(--muted);margin:0 0 20px;font-size:13.5px}
.weeks{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px;position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:5;border-bottom:1px solid var(--line)}
.wb{background:var(--surface);border:1px solid var(--line);color:var(--ink2);border-radius:999px;
    padding:7px 16px;font:inherit;font-size:13.5px;cursor:pointer;white-space:nowrap}
.wb:hover{color:var(--ink);border-color:var(--line2)}
.wb.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:500}
.week{display:none}
.week.on{display:block}
.wtitle{font-size:13px;color:var(--muted);margin:20px 0 0}
h2{font-size:21px;margin:10px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line);font-weight:700;letter-spacing:-.2px}
h3{font-size:16px;margin:26px 0 8px;color:var(--ink);font-weight:700}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin:14px 0}
.doc > *:first-child{margin-top:0}
p{margin:10px 0}
ul,ol{margin:10px 0;padding-left:22px}
li{margin:5px 0}
li > ul,li > ol{margin:4px 0}
b{color:var(--ink);font-weight:700}
code{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:13px;font-family:var(--mono);color:var(--ink2)}
.meta{color:var(--muted);font-size:13px;margin:0 0 12px}
.empty{color:var(--muted);padding:30px 0}
.none{color:var(--muted);font-size:13px;margin:6px 0}
pre.cb{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px 14px;
  margin:10px 0;overflow-x:auto;font-size:12.5px;line-height:1.6;color:var(--ink2);white-space:pre;font-family:var(--mono)}
.tw{overflow-x:auto;margin:10px 0}
table.t.md td{white-space:nowrap}
table.t.md td:first-child{color:var(--ink);font-weight:500}
.cnt{color:var(--muted);font-size:12.5px;font-weight:400;margin-left:8px}
a.wcl{color:var(--accent);text-decoration:none;font-size:12.5px;font-weight:400;margin-left:10px;white-space:nowrap}
a.wcl:hover{text-decoration:underline}
.bosstabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.bb{background:var(--sunk);border:1px solid var(--line);color:var(--ink2);border-radius:7px;
    padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.bb:hover{color:var(--ink);border-color:var(--line2)}
.bb.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:500}
.bossblock{display:none}
.bossblock.on{display:block}
table.t{width:100%;border-collapse:collapse;margin:8px 0 4px;font-size:13.5px}
table.t th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;
           border-bottom:1px solid var(--line2);padding:6px 8px 7px}
table.t td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
td.r,th.r{width:28px;text-align:right}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.nm{color:var(--ink);white-space:nowrap;font-weight:500}
td.sp{color:var(--muted);font-size:12px;white-space:nowrap}
td.dim{color:var(--ink2)}
.bar{display:inline-block;width:96px;height:8px;background:var(--sunk);border-radius:4px;
     overflow:hidden;margin-right:8px;vertical-align:middle}
.bar i{display:block;height:100%;border-radius:4px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:0 22px}
@media (max-width:520px){.bar{width:52px}table.t{font-size:12.5px}td.sp{display:none}th:nth-child(3){display:none}}
@media (max-width:520px){.wrap{padding:16px 12px 70px}.brand{font-size:25px}.doc{padding:14px 15px}}
</style></head>
<body><div class="wrap">
  <h1 class="brand">y2k 개인 진단</h1>
  <p class="brandsub"><a href="../">← 주간 피드백</a></p>
  <div id="meOut"></div>
</div>
<script>
const PERSONAL = {"Chillage": ["<div class=\"pdoc\"><p class=\"meta\">10/12 레이드 기준</p><h2>개인 진단 — Chillage (비전 법사) · 10/12 신화 넥잘리 킬</h2><p><b>결론: 2페 시작 폭딜을 놓쳤다. 랭커는 2페 시작 10초 안에 비전 쇄도를 쓰고 30초 동안 보스만 쳐서 29~47만을 내는데, Chillage님은 비전 쇄도를 50초 늦게(6:14) 쓰고 그 시간에 쫄을 쳤다. 그 밖에 신비한 화살·오색 화살을 덜 쓰고 비전 보주를 두 배 쓴다.</b></p><h3>시간대별 — 비슷한 킬 시간 랭커 5명과 비교 (7:48~7:56 킬, 페이즈 시작 기준 10초 단위)</h3><ul><li><b>2페 시작(5:14) +10~+40초 = 5:24~5:54</b> — 랭커 초당 29~47만 · Chillage 6.6~19만<ul><li>랭커: 2페 +10초 안에 비전 쇄도(5명 중 2명은 +10~20초), 빛의 잠재력. 보스만 친다(쫄 딜 0.4만)</li><li>Chillage: 이 30초에 쫄을 6마리까지 쳤고(쫄 딜 6.7만·7.7만) 비전 쇄도는 <b>6:14(2페 +60초)</b> 에 썼다</li></ul></li><li><b>쫄 구간이 랭커와 어긋난다</b> — 랭커가 쫄(쉬지 않는 아마니)을 칠 때 Chillage는 보스를 치고, 랭커가 보스를 칠 때 쫄을 쳤다<ul><li>랭커만 쫄: 2:20 · 4:31 · 5:54 · 6:14 · 7:24 · 7:34 (랭커 쫄 딜 초당 9~27만, Chillage 0~7만)</li><li>Chillage만 쫄: 4:01~4:21 (랭커는 보스만)</li></ul></li><li><b>보스에서 멀리 떨어진 순간 딜이 같이 빠졌다</b> — 1:00(45야드) · 2:40(54야드) · 4:11~4:21(53~59야드) · 6:14(39야드) · 7:34(42야드). 랭커는 같은 시각 13~29야드</li><li>인터 시작(2:51) 비전 쇄도는 랭커와 같은 타이밍(3:01)</li></ul><h3>숫자</h3><ul><li>DPS 19.9만 · 랭커 중앙 24.7만 (-19%). 랭커 = 신화 넥잘리 비전 법사 상위 30명 킬 로그</li><li>우리 공대 딜러 2위 (섭섭 다음)</li><li>템렙 326 · 랭커 331</li><li>활동시간 99.9% (랭커 99.7%) — 쉬는 시간 없음</li><li>분당 시전 41.4회 · 랭커 45.9회 (-10%)</li></ul><h3>덜 쓴 것 (분당, 활동시간 기준)</h3><ul><li>신비한 화살 13.2 · 랭커 15.9 → 초당 딜 -1.6만</li><li>오색 화살 4.2 · 랭커 5.6 → 초당 딜 -1.6만</li><li>비전 작렬 3.1 · 랭커 4.4 → 초당 딜 -0.2만</li><li>일렁임 0.75 · 랭커 1.14</li><li>시간 왜곡 0회 (랭커 30명 중 20명 사용)</li></ul><h3>더 쓴 것</h3><ul><li>비전 보주 1.62 · 랭커 0.73 — 두 배</li><li>비전 탄막 15.1 · 랭커 14.0</li></ul><h3>문제없는 것</h3><ul><li>이차 스탯: 치명 754 · 가속 1100 · 특화 509 · 유연 665 — 전부 랭커 30명 범위(치명 579~1544 · 가속 715~1254 · 특화 342~854 · 유연 339~944) 안</li><li>영웅 특성: 성난태양 — 랭커 30명 전원 같은 트리</li><li>특성: 랭커와 1개 차이(탈출의 대가, 랭커 77% 사용 · 생존 특성)</li><li>보스와의 거리 중앙 19.3야드</li></ul><h3>해 볼 것</h3><ul><li>2페 들어가면 바로 비전 쇄도 → 30초는 보스만</li><li>쫄 칠 때를 공대 쫄 콜에 맞춘다 (위 시각)</li><li>신비한 화살·오색 화살이 뜨면 바로 쓴다 — 랭커는 분당 16회·5.6회</li><li>비전 보주는 쿨마다 쓰지 않는다 — 랭커는 분당 0.7회</li><li>확인 안 한 것: 일렁임(폭딜 창) 안에서 무엇을 누르는지 · 오색 화살 발동 조건. 다음에 창 단위로 본다</li></ul></div>"]};
const q = (new URLSearchParams(location.search).get('n') || '').trim().toLowerCase();
const ks = Object.keys(PERSONAL);
const key = q && (ks.find(k => k.toLowerCase() === q) || ks.find(k => k.toLowerCase().includes(q)));
document.getElementById('meOut').innerHTML = key ? PERSONAL[key].join('')
  : '<div class="pdoc"><p>' + (q ? q.replace(/</g,'&lt;') + ' — 개인 진단이 아직 없습니다.' : '닉네임이 없습니다.') + '</p><p class="meta">진단 있는 사람: ' + (ks.join(' · ') || '없음') + '</p></div>';
if (key) document.title = 'y2k — ' + key + ' 개인 진단';
</script></body></html>
