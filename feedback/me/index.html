const key = q && (ks.find(k => k.toLowerCase() === q) || ks.find(k => k.toLowerCase().includes(q)));
document.getElementById('meOut').innerHTML = key ? PERSONAL[key].join('')
  : '<div class="pdoc"><p>' + (q ? q.replace(/</g,'&lt;') + ' — 개인 진단이 아직 없습니다.' : '닉네임이 없습니다.') + '</p><p class="meta">진단 있는 사람: ' + (ks.join(' · ') || '없음') + '</p></div>';
if (key) document.title = 'y2k — ' + key + ' 개인 진단';
</script></body></html>
